<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 - Next Level</title>
    <!-- Google Fonts for premium modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="2048.css">
</head>
<body>
    <div class="game-wrapper">
        <!-- Ambient background lights -->
        <div class="ambient-glow glow-1"></div>
        <div class="ambient-glow glow-2"></div>

        <!-- Top Header Bar -->
        <header class="game-header">
            <div class="brand">
                <h1 class="logo">2048</h1>
                <span class="badge">EDITION</span>
            </div>
            
            <div class="stats-panel">
                <div class="stat-box">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-value" id="score">0</span>
                </div>
                <div class="stat-box">
                    <span class="stat-label">BEST</span>
                    <span class="stat-value" id="best-score">0</span>
                </div>
            </div>
        </header>

        <!-- Subheader & Controls -->
        <div class="controls-bar">
            <p class="tagline">Join matching tiles to reach <span class="highlight">2048</span>!</p>
            <button id="restart-btn" class="btn btn-primary" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
                <span>New Game</span>
            </button>
        </div>

        <!-- Game Board Container -->
        <div class="board-container">
            <div id="board" class="board"></div>

            <!-- Game Over / Victory Overlay -->
            <div id="overlay" class="overlay hidden">
                <div class="overlay-card">
                    <h2 id="overlay-title" class="overlay-title">Game Over!</h2>
                    <p id="overlay-desc" class="overlay-desc">No more possible moves.</p>
                    <div class="overlay-score-box">
                        <span>Final Score</span>
                        <strong id="overlay-score">0</strong>
                    </div>
                    <div class="overlay-actions">
                        <button id="keep-playing-btn" class="btn btn-secondary hidden" type="button">Keep Going</button>
                        <button id="overlay-restart-btn" class="btn btn-primary" type="button">Play Again</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls guide / hints -->
        <footer class="game-footer">
            <div class="hint-item">
                <div class="keys-group">
                    <span class="key">W</span>
                    <span class="key">A</span>
                    <span class="key">S</span>
                    <span class="key">D</span>
                </div>
                <span class="hint-text">or Arrow Keys to slide</span>
            </div>
            <div class="hint-item mobile-hint">
                <span class="hint-text">Swipe in any direction on mobile</span>
            </div>
        </footer>
    </div>

    <script src="2048.js"></script>
</body>
</html>
